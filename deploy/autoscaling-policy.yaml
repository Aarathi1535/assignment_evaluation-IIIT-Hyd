# ==============================================================================
# Cloud Run Knative Autoscaling Policy Specification (AE-232)
# ==============================================================================
# This manifest defines the Knative Serving autoscaling specification for the
# Assignment Evaluator service on Google Cloud Run.
#
# NOTE: Aligned with deploy/cloudrun-service.yaml (PR #355):
# - minScale is set to "1" (warm standby instance to mitigate cold starts without over-provisioning)
# - maxScale is set to "10" (horizontal scale limit to protect MongoDB Atlas connection pools)
# - containerConcurrency is set to 80 (requests per container instance before horizontal scale-out)
# ==============================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: assignment-evaluator
  namespace: default
  labels:
    cloud.googleapis.com/location: asia-south1
    environment: production
    app: assignment-evaluator
spec:
  template:
    metadata:
      annotations:
        # Minimum warm instances (aligned with deploy/cloudrun-service.yaml minScale: 1)
        autoscaling.knative.dev/minScale: "1"
        # Maximum horizontal scaling ceiling (10 instances * 50 conn/instance = 500 conns, safely within Atlas M10)
        autoscaling.knative.dev/maxScale: "10"
        # Target concurrency utilization before triggering scale-up (70% of 80 = 56 concurrent requests)
        autoscaling.knative.dev/targetUtilizationPercentage: "70"
        # Disable CPU throttling so background canvas workers and PDF streaming run at full speed
        run.googleapis.com/cpu-throttling: "false"
        # Use Gen2 execution environment for full Linux POSIX and filesystem compatibility
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
