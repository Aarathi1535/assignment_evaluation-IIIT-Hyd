# ==============================================================================
# Autoscaling Configuration and Policy Specification (AE-232)
# ==============================================================================
# This document defines dual-target declarative autoscaling policies for:
#   1. Google Cloud Run (Knative Serving) Serverless Container Autoscaler
#   2. Kubernetes HorizontalPodAutoscaler (autoscaling/v2)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Google Cloud Run Knative Autoscaling Specification
# ------------------------------------------------------------------------------
cloudRunPolicy:
  apiVersion: serving.knative.dev/v1
  kind: Service
  metadata:
    name: assignment-evaluator-production
    namespace: assignment-evaluator
    labels:
      environment: production
      app: assignment-evaluator
  spec:
    template:
      metadata:
        annotations:
          # Minimum warm instances to eliminate cold start latency during exam grading
          autoscaling.knative.dev/minScale: "2"
          # Maximum horizontal scaling ceiling to protect database connection pools
          autoscaling.knative.dev/maxScale: "10"
          # Target concurrency utilization before triggering scale-up (70% of 80 = 56 concurrent requests)
          autoscaling.knative.dev/targetUtilizationPercentage: "70"
          # Disable CPU throttling so background canvas workers and PDF streaming run at full speed
          run.googleapis.com/cpu-throttling: "false"
          # Use Gen2 execution environment for full Linux POSIX and filesystem compatibility
          run.googleapis.com/execution-environment: gen2
      spec:
        containerConcurrency: 80
        timeoutSeconds: 300

---
# ------------------------------------------------------------------------------
# 2. Kubernetes HorizontalPodAutoscaler (HPA v2) Specification
# ------------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: assignment-evaluator-hpa
  namespace: assignment-evaluator
  labels:
    app.kubernetes.io/name: assignment-evaluator
    app.kubernetes.io/component: web-service
    app.kubernetes.io/part-of: assignment-evaluation-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: assignment-evaluator
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # Rapid scale-up to absorb grading spikes and batch ingest burst
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
        - type: Percent
          value: 50
          periodSeconds: 15
    scaleDown:
      # 5-minute stabilization window to prevent flapping between grading submissions
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
