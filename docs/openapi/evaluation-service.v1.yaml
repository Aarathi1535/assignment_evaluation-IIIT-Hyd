openapi: 3.1.0
info:
  title: IIIT Hyderabad Assignment Evaluation Service API
  version: 1.0.0
  license:
    name: Proprietary - IIIT Hyderabad Internal Educational License
    identifier: Proprietary
  description: >
    Headless REST API for Assignment Evaluation (Product 1).
    Provides end-to-end assignment and examination management, physical answer-sheet ingestion
    and splitting, TA allocations, rubrics, handwritten script annotation and grading, regrading
    workflows, comprehensive audit logs, and LMS grade exports.
  contact:
    name: IIIT Hyderabad Learning Platform Engineering Team
servers:
  - url: https://eval.iiit.ac.in/api/v1
    description: Production Evaluation Service
  - url: https://staging-eval.iiit.ac.in/api/v1
    description: Staging Evaluation Service

paths:
  /health:
    get:
      summary: Service health check
      description: Returns health status and component readiness.
      operationId: getEvaluationHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - uptime
                properties:
                  status:
                    type: string
                    example: healthy
                  uptime:
                    type: number
                    example: 7200
        '400':
          $ref: '#/components/responses/BadRequestError'

  /exams:
    get:
      summary: List course examinations and assignments
      description: Retrieve paginated examinations filtered by course code or evaluation status.
      operationId: listExams
      security:
        - PlatformBearerAuth: []
        - EvaluationSessionAuth: []
      parameters:
        - name: courseCode
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, GRADING, COMPLETED, RESULTS_RELEASED]
      responses:
        '200':
          description: List of examinations returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExamsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      summary: Create a new examination or assignment
      description: Instructors create a new exam with total marks, rubrics, and submission windows.
      operationId: createExam
      security:
        - PlatformBearerAuth: []
        - EvaluationSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExamRequest'
      responses:
        '201':
          description: Exam created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamDetailsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /exams/{id}:
    get:
      summary: Get examination details
      description: Returns examination configuration, question breakdown, rubrics, and grading progress.
      operationId: getExamById
      security:
        - PlatformBearerAuth: []
        - EvaluationSessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Examination details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamDetailsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /exams/{id}/allocations:
    post:
      summary: Allocate submission batches to teaching assistants
      description: Instructors assign scripts to graders using equal, question-scoped, or random allocation strategies.
      operationId: allocateGraders
      security:
        - PlatformBearerAuth: []
        - EvaluationSessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
      responses:
        '200':
          description: Graders allocated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /scripts/{scriptId}/grade:
    post:
      summary: Save manual grading scores and annotations
      description: TAs and professors submit itemized marks, rubric criteria scores, and canvas annotations on handwritten pages.
      operationId: submitScriptGrade
      security:
        - PlatformBearerAuth: []
        - EvaluationSessionAuth: []
      parameters:
        - name: scriptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSubmissionRequest'
      responses:
        '200':
          description: Grade and annotations saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeSubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /regrades:
    get:
      summary: List student regrade requests
      description: Instructors and assigned TAs view pending regrade requests with question justifications.
      operationId: listRegradeRequests
      security:
        - PlatformBearerAuth: []
        - EvaluationSessionAuth: []
      parameters:
        - name: examId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED]
      responses:
        '200':
          description: Regrade requests retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegradeListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    PlatformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Asymmetrically signed RS256 token issued by Platform Identity Service.
    EvaluationSessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth session cookie for Assignment Evaluation portal.

  schemas:
    CreateExamRequest:
      type: object
      required:
        - courseCode
        - title
        - totalMarks
      properties:
        courseCode:
          type: string
          example: CS201
        title:
          type: string
          example: Midterm Examination Autumn 2026
        totalMarks:
          type: number
          example: 100
        rubricId:
          type: string

    ExamDetailsResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - id
            - courseCode
            - title
            - totalMarks
            - status
          properties:
            id:
              type: string
            courseCode:
              type: string
            title:
              type: string
            totalMarks:
              type: number
            status:
              type: string
              enum: [DRAFT, PUBLISHED, GRADING, COMPLETED, RESULTS_RELEASED]
            submissionsCount:
              type: integer
            gradedCount:
              type: integer

    PaginatedExamsResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExamDetailsResponse'

    AllocationRequest:
      type: object
      required:
        - strategy
        - taIds
      properties:
        strategy:
          type: string
          enum: [EQUAL, QUESTION_SCOPED, RANDOM]
        taIds:
          type: array
          items:
            type: string

    AllocationResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            totalAllocated:
              type: integer
            allocationMap:
              type: object

    GradeSubmissionRequest:
      type: object
      required:
        - totalScore
        - questionScores
      properties:
        totalScore:
          type: number
        questionScores:
          type: array
          items:
            type: object
            required:
              - questionNumber
              - score
            properties:
              questionNumber:
                type: integer
              score:
                type: number
              comment:
                type: string
        annotations:
          type: array
          items:
            type: object

    GradeSubmissionResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            scriptId:
              type: string
            finalScore:
              type: number
            gradedBy:
              type: string
            gradedAt:
              type: string
              format: date-time

    RegradeListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              examId:
                type: string
              studentRollNumber:
                type: string
              status:
                type: string
              reason:
                type: string

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    BadRequestError:
      description: Invalid parameters or bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UnauthorizedError:
      description: Missing or expired authentication token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ForbiddenError:
      description: Insufficient grading or staff role privileges
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFoundError:
      description: Exam or script resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
