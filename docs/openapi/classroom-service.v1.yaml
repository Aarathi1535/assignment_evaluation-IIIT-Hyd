openapi: 3.1.0
info:
  title: IIIT Hyderabad Classroom Activity Service API
  version: 1.0.0
  license:
    name: Proprietary - IIIT Hyderabad Internal Educational License
    identifier: Proprietary
  description: >
    Headless REST API for Classroom Activity (Product 2). Supports dual capabilities:
    1) Primary Workflow: Timed handwritten answer-sheet uploads, OCR extraction, and human-in-the-loop AI draft verification.
    2) Complementary Workflow: Mentimeter-inspired live engagement polls, QR/PIN guest joining, and real-time response distribution streaming.
  contact:
    name: IIIT Hyderabad Learning Platform Engineering Team
servers:
  - url: https://classroom.iiit.ac.in/api/v1
    description: Production Classroom Activity Service
  - url: https://staging-classroom.iiit.ac.in/api/v1
    description: Staging Classroom Activity Service

paths:
  /sessions:
    post:
      summary: Create a new classroom session
      description: Instructors create a timed classroom session for live polling and/or handwritten assessment.
      operationId: createClassroomSession
      security:
        - ClassroomAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created successfully with generated PIN and QR token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    get:
      summary: List classroom sessions
      description: Retrieve paginated sessions created by or assigned to the authenticated instructor.
      operationId: listClassroomSessions
      security:
        - ClassroomAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, ACTIVE, CLOSED, ARCHIVED]
      responses:
        '200':
          description: List of classroom sessions returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /sessions/{id}:
    get:
      summary: Get classroom session details
      description: Retrieve session state, access codes, and participant metrics.
      operationId: getSessionById
      security:
        - ClassroomAuth: []
        - GuestParticipantAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: Classroom session details returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      summary: Update session state (activate, close, extend window)
      description: Instructors modify status or extend the timer on an active session.
      operationId: updateSessionState
      security:
        - ClassroomAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Session state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /sessions/{id}/code:
    post:
      summary: Generate or regenerate session PIN and QR join code
      description: Re-issues a 6-digit access code and QR URL for participant check-in.
      operationId: regenerateSessionCode
      security:
        - ClassroomAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: Session access PIN and QR code generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sessionCode:
                        type: string
                        example: "482910"
                      qrCodeUrl:
                        type: string
                        format: uri
                        example: "https://classroom.iiit.ac.in/join/482910"
                      expiresAt:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /join/{code}:
    post:
      summary: Guest or student join via 6-digit session PIN or QR scan
      description: >
        Public entry point for students and guests to join an active classroom session. Issues an ephemeral,
        session-scoped participant JWT token. Requires roll number disambiguation if duplicate display names exist.
        Rate-limited to protect 6-digit PIN keyspace against brute-force enumeration.
      operationId: joinClassroomSession
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{6}$'
            example: "482910"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinSessionRequest'
      responses:
        '201':
          description: Successfully joined. Returns session-scoped participant token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          description: Session code not found or session has ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        '409':
          description: Duplicate participant name requires explicit roll number disambiguator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /sessions/{id}/polls:
    post:
      summary: Create an interactive live poll for this session
      description: Instructor creates an engagement poll (single-choice, multiple-choice, rating scale).
      operationId: createPoll
      security:
        - ClassroomAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePollRequest'
      responses:
        '201':
          description: Poll created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /polls/{id}/publish:
    post:
      summary: Push poll live to all session participants
      description: Triggers a real-time SSE event to all connected participant screens.
      operationId: publishPoll
      security:
        - ClassroomAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Poll successfully published and pushed to participant screens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /polls/{id}/close:
    post:
      summary: Close an active live poll
      description: Concludes voting on the active poll and aggregates final response metrics.
      operationId: closePoll
      security:
        - ClassroomAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Poll successfully closed and voting locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /polls/{id}/responses:
    post:
      summary: Submit participant response to a live poll
      description: Submitted by students or guests holding a valid session participant token.
      operationId: submitPollResponse
      security:
        - GuestParticipantAuth: []
        - ClassroomAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - selectedOptions
              properties:
                selectedOptions:
                  type: array
                  items:
                    type: integer
                  example: [0]
      responses:
        '200':
          description: Poll response recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Response recorded"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Poll is closed or participant already responded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /sessions/{id}/live-stats:
    get:
      summary: Get live participation count and aggregated poll distributions
      description: Used by professor dashboard to display real-time engagement charts without disclosing individual names prematurely.
      operationId: getLiveSessionStats
      security:
        - ClassroomAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: Aggregated participation metrics and current poll results returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSessionStatsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /sessions/{id}/events:
    get:
      summary: Server-Sent Events (SSE) stream for real-time classroom updates
      description: Streams poll launches, response tallies, and window status changes to connected browsers.
      operationId: streamSessionEvents
      security:
        - ClassroomAuth: []
        - GuestParticipantAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: Active SSE text stream connection established
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /submissions/upload-sheet:
    post:
      summary: Upload handwritten answer-sheet photo within timed classroom window
      description: >
        Primary workflow. Student submits physical handwritten solution captured via mobile camera.
        Enforces strict window checks, file integrity, and queues for OCR + AI-assisted evaluation.
      operationId: uploadAnswerSheet
      security:
        - ClassroomAuth: []
        - GuestParticipantAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - sessionId
                - questionNumber
                - image
              properties:
                sessionId:
                  type: string
                  example: "672cd50172e27b4e9f7a9d01"
                questionNumber:
                  type: integer
                  example: 1
                image:
                  type: string
                  format: binary
                  description: JPEG or PNG photograph of the handwritten answer page.
      responses:
        '201':
          description: Answer sheet accepted and queued for OCR extraction and draft evaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatusResponse'
        '400':
          description: Invalid image format or corrupted file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Classroom activity window has closed (SESSION_EXPIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /submissions/{id}:
    get:
      summary: Get submission status, extracted text, and evaluation state
      description: Inspect OCR processing state, AI draft score recommendation, or approved marks.
      operationId: getSubmissionStatus
      security:
        - ClassroomAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Submission details and evaluation state returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /submissions/{id}/approve:
    patch:
      summary: Professor approves AI draft evaluation (Human-in-the-Loop gate)
      description: >
        Finalizes an evaluation that was generated in DRAFT_EVALUATED state by OCR/AI.
        Grades remain inaccessible to students until this human verification step completes.
      operationId: approveEvaluation
      security:
        - ClassroomAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verifiedScore
              properties:
                verifiedScore:
                  type: number
                  example: 8.5
                feedbackNotes:
                  type: string
                  example: "Well reasoned derivation of recurrence relation."
      responses:
        '200':
          description: Evaluation verified, approved, and finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /submissions/{id}/reject:
    patch:
      summary: Professor rejects an invalid or illegible answer-sheet submission
      description: Marks a submission as REJECTED with an audited rejection reason.
      operationId: rejectSubmission
      security:
        - ClassroomAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rejectionReason
              properties:
                rejectionReason:
                  type: string
                  example: "Image is out of focus, blurry, and text cannot be recognized."
      responses:
        '200':
          description: Submission rejected and marked with REJECTED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /sessions/{id}/submissions/review-queue:
    get:
      summary: List submissions awaiting staff review in the evaluation queue
      description: Returns a paginated queue of submissions in DRAFT_EVALUATED status requiring human verification.
      operationId: listReviewQueue
      security:
        - ClassroomAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Paginated queue of submissions pending evaluation review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /sessions/{id}/results:
    get:
      summary: Complete professor-facing session results and gradebook export
      description: Returns comprehensive individual participant results, poll counts, and approved scores.
      operationId: getSessionResults
      security:
        - ClassroomAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: Complete session results and participant scores returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResultsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    ClassroomAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard Classroom account token (Instructor / Registered Student).
    GuestParticipantAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ephemeral session-scoped guest token issued upon PIN/QR join.

  parameters:
    SessionIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: "672cd50172e27b4e9f7a9d01"
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
        example: "7b864d42-0f18-4b72-881b-5136814d8b67"
      description: Unique UUID token ensuring safe retries for mutating upload operations.

  schemas:
    CreateSessionRequest:
      type: object
      required:
        - title
        - courseId
        - opensAt
        - closesAt
      properties:
        title:
          type: string
          example: "Lecture 8: Dynamic Programming Live Quiz"
        courseId:
          type: string
          example: "CS3001"
        opensAt:
          type: string
          format: date-time
        closesAt:
          type: string
          format: date-time
        allowGuestJoin:
          type: boolean
          default: true
        requireRegisteredForGrading:
          type: boolean
          default: true
          description: Requires authenticated student identity for graded handwritten answer-sheet submissions.

    UpdateSessionRequest:
      type: object
      properties:
        status:
          type: string
          enum: [SCHEDULED, ACTIVE, CLOSED, ARCHIVED]
        closesAt:
          type: string
          format: date-time

    SessionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
            courseId:
              type: string
            sessionCode:
              type: string
            status:
              type: string
            opensAt:
              type: string
              format: date-time
            closesAt:
              type: string
              format: date-time
            participantCount:
              type: integer
            activePollId:
              type: [string, 'null']

    PaginatedSessionsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionResponse'
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                limit:
                  type: integer
                totalCount:
                  type: integer
                totalPages:
                  type: integer

    JoinSessionRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          example: "Alice Sharma"
        studentRollNumber:
          type: string
          example: "2024101001"
          description: Required if duplicate name exists in session or when participating in verified submissions.

    JoinSessionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            participantToken:
              type: string
              description: Ephemeral session-scoped JWT to pass in Authorization header.
            participantId:
              type: string
            sessionId:
              type: string
            sessionTitle:
              type: string

    CreatePollRequest:
      type: object
      required:
        - prompt
        - options
      properties:
        prompt:
          type: string
          example: "What is the tight asymptotic lower bound for comparison sorts?"
        options:
          type: array
          items:
            type: string
          example: ["O(n)", "Omega(n log n)", "Theta(n^2)", "O(log n)"]
        timeLimitSeconds:
          type: integer
          default: 60

    PollResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
            prompt:
              type: string
            options:
              type: array
              items:
                type: string
            status:
              type: string
              enum: [DRAFT, ACTIVE, CLOSED]
            totalVotes:
              type: integer

    LiveSessionStatsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            sessionId:
              type: string
            connectedParticipants:
              type: integer
            handwrittenSheetsUploaded:
              type: integer
            currentPoll:
              type: [object, 'null']
              properties:
                pollId:
                  type: string
                distribution:
                  type: array
                  items:
                    type: object
                    properties:
                      optionIndex:
                        type: integer
                      voteCount:
                        type: integer
                      percentage:
                        type: number

    SubmissionStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            submissionId:
              type: string
            sessionId:
              type: string
            questionNumber:
              type: integer
            status:
              type: string
              enum: [RECEIVED, OCR_PROCESSING, DRAFT_EVALUATED, APPROVED, REJECTED]
            extractedText:
              type: [string, 'null']
            aiScoreDraft:
              type: [number, 'null']
            verifiedScore:
              type: [number, 'null']
            approvedBy:
              type: [string, 'null']
            approvedAt:
              type: [string, 'null']
              format: date-time

    PaginatedSubmissionsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionStatusResponse'
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                limit:
                  type: integer
                totalCount:
                  type: integer
                totalPages:
                  type: integer

    ParticipantResult:
      type: object
      required:
        - participantId
        - displayName
      properties:
        participantId:
          type: string
        displayName:
          type: string
        studentRollNumber:
          type: [string, 'null']
        pollResponseCount:
          type: integer
        handwrittenScore:
          type: [number, 'null']
        submissionStatus:
          type: [string, 'null']
          enum: [RECEIVED, OCR_PROCESSING, DRAFT_EVALUATED, APPROVED, REJECTED, 'null']

    SessionResultsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            sessionId:
              type: string
            totalSubmissions:
              type: integer
            approvedSubmissions:
              type: integer
            averageScore:
              type: number
            participants:
              type: array
              items:
                $ref: '#/components/schemas/ParticipantResult'

    ErrorPayload:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: "SESSION_EXPIRED"
            message:
              type: string
              example: "This classroom session has ended and is closed for submissions."
            details:
              type: [object, 'null']
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            requestId:
              type: string

  responses:
    BadRequestError:
      description: Malformed or unparseable request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    UnauthorizedError:
      description: Authentication token missing, expired, or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    ForbiddenError:
      description: User lacks sufficient role or session scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    NotFoundError:
      description: Requested session or resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    ConflictError:
      description: State conflict or duplicate active resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    TooManyRequestsError:
      description: Rate limit exceeded; client must back off before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    UnprocessableEntityError:
      description: Semantic or idempotency key mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
